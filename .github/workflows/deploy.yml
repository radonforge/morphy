name: Deploy

on:
  workflow_call:
    inputs:
      deploy-dir:
        required: true
        type: string
      web-dir:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @morphy/client build

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Add deploy host to known_hosts
        run: |
          mkdir -p ~/.ssh
          for i in $(seq 1 5); do
            ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan failed, retrying in 5s... (attempt $i/5)"
            sleep 5
          done
          grep -q . ~/.ssh/known_hosts || exit 1

      - name: Ship client + pull server (${{ inputs.tag }})
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ inputs.deploy-dir }}
          WEB_DIR: ${{ inputs.web-dir }}
          TAG: ${{ inputs.tag }}
        run: |
          rsync -az compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/compose.yml"
          rsync -az --delete packages/client/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$WEB_DIR/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail && cd '$DEPLOY_DIR' && export MORPHY_TAG='$TAG' && \
             docker compose pull server && docker compose up -d server && docker image prune -f"
