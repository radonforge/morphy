name: Deploy

on:
  workflow_call:
    inputs:
      deploy-dir:
        required: true
        type: string
      web-dir:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @morphy/client build

      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Add deploy host to known_hosts
        run: |
          mkdir -p ~/.ssh
          for i in $(seq 1 5); do
            ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan failed, retrying in 5s... (attempt $i/5)"
            sleep 5
          done
          grep -q . ~/.ssh/known_hosts || exit 1

      - name: Ship client + pull server (${{ inputs.tag }})
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ inputs.deploy-dir }}
          WEB_DIR: ${{ inputs.web-dir }}
          TAG: ${{ inputs.tag }}
        run: |
          rsync -az compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/compose.yml"
          rsync -az --delete packages/client/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$WEB_DIR/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail && cd '$DEPLOY_DIR' && export MORPHY_TAG='$TAG' && \
             docker compose pull server && docker compose up -d server && docker image prune -f"
