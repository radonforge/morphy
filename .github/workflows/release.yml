name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev
        run: |
          prev=$(git tag --sort=-version:refname | sed -n '2p')
          echo "tag=${prev:-$(git rev-list --max-parents=0 HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          SINCE: ${{ steps.prev.outputs.tag }}
          CURRENT: ${{ github.ref_name }}
        run: |
          declare -A sections
          sections=(
            [feat]="New Features"
            [fix]="Bug Fixes"
            [refactor]="Refactoring"
            [perf]="Performance"
            [docs]="Documentation"
            [test]="Tests"
            [style]="Style"
            [chore]="Maintenance"
          )

          order=(feat fix refactor perf docs test style chore)
          tmpdir=$(mktemp -d)

          while IFS= read -r line; do
            hash="${line%% *}"
            msg="${line#* }"

            matched=false
            for prefix in "${order[@]}"; do
              if [[ "$msg" =~ ^${prefix}(\(.+\))?:\ (.+)$ ]]; then
                scope="${BASH_REMATCH[1]}"
                desc="${BASH_REMATCH[2]}"
                if [[ -n "$scope" ]]; then
                  printf -- '- %s (%s) (%s)\n' "$desc" "$scope" "$hash" >> "${tmpdir}/${prefix}"
                else
                  printf -- '- %s (%s)\n' "$desc" "$hash" >> "${tmpdir}/${prefix}"
                fi
                matched=true
                break
              fi
            done

            if [[ "$matched" == false ]]; then
              printf -- '- %s (%s)\n' "$msg" "$hash" >> "${tmpdir}/uncategorized"
            fi
          done < <(git log "${SINCE}..${CURRENT}" --pretty=format:"%h %s" --no-merges)

          body=""
          for prefix in "${order[@]}"; do
            if [[ -f "${tmpdir}/${prefix}" ]]; then
              body+="## ${sections[$prefix]}"$'\n\n'
              body+="$(cat "${tmpdir}/${prefix}")"$'\n\n'
            fi
          done

          if [[ -f "${tmpdir}/uncategorized" ]]; then
            body+="## Other"$'\n\n'
            body+="$(cat "${tmpdir}/uncategorized")"$'\n\n'
          fi

          if [[ -z "$body" ]]; then
            body="No changes since previous release."
          fi

          rm -rf "$tmpdir"

          {
            echo "body<<RELEASE_EOF"
            echo "$body"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.notes.outputs.body }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "$RELEASE_BODY" | gh release create "$TAG" \
            --title "${TAG#v}" \
            --notes-file -
