server {
    listen 3000;
    server_name morphy.radonforge.com;
    root /var/www/morphy.radonforge.com/dist;

    include /etc/nginx/snippets/overbot-security.conf;
    # nginx only inherits `add_header` when a level declares none of its own, so
    # every location that sets Cache-Control must re-include the security headers.

    # Colyseus matchmaking (HTTP) + realtime (WebSocket). The trailing slashes on
    # location and proxy_pass strip the /colyseus prefix, mirroring the Vite dev
    # proxy rewrite so the server sees requests at its root.
    location /colyseus/ {
        proxy_pass http://127.0.0.1:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Lifetime stats read (device id travels in a header, path preserved).
    location = /stats {
        proxy_pass http://127.0.0.1:2567/stats;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }

    # Static site pages: /<slug> serves the build's <slug>.html, which keeps a
    # stable filename like index.html, so it revalidates after a deploy. A slug
    # with no page falls back to the game.
    location ~ ^/[a-z0-9-]+$ {
        include /etc/nginx/snippets/overbot-security.conf;
        add_header Cache-Control "no-cache";
        try_files $uri.html /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/overbot-security.conf;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        include /etc/nginx/snippets/overbot-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /models/ {
        include /etc/nginx/snippets/overbot-security.conf;
        # Public models keep stable filenames, so clients must revalidate after a deploy.
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location /sounds/ {
        include /etc/nginx/snippets/overbot-security.conf;
        # Public sounds keep stable filenames, so clients must revalidate after a deploy.
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
